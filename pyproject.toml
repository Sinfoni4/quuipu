[project]
name = "quuipu"
version = "0.1.0"
description = "Agente AI che ricompone il sito aziendale in funzione del visitatore"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
quuipu-crawl = "quuipu.ingestion.crawler:main"
quuipu-parse-docs = "quuipu.ingestion.documents:main"
quuipu-describe-images = "quuipu.ingestion.images:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
