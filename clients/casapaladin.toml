# Cliente pilota del PoC: cantina vitivinicola (settore agrifood).
id = "casapaladin"
name = "Casa Paladin"
sector = "agrifood"
base_url = "https://www.casapaladin.it/"
languages = ["it", "en"]
# Siti da cui il widget può chiamare l'API: il sito del cliente e il pilota.
allowed_origins = ["https://www.casapaladin.it", "https://casapaladin.quuipu.me"]

# Profili di visitatore: per ora valgono quelli generici della specifica
# (buyer_estero, distributore, privato, ente, curioso). I profili specifici
# per la cantina sono un punto aperto; si aggiungono così:
#
# [[profiles]]
# id = "..."
# name = "..."
# looks_for = "..."
# highlight = "..."

[ingestion]
confidence_threshold = 0.7
image_categories = [
    "bottiglia",
    "vigneto",
    "cantina",
    "degustazione",
    "persone",
    "evento",
    "paesaggio",
    "logo",
    "altro",
]

[crawl]
max_pages = 300
delay_seconds = 1.0
# Area riservata e pagine tecniche: non sono contenuti pubblici da usare.
exclude = [
    "/portal/",
    "/login-page/",
    "/registrazione-client/",
    "/successful-client-registration/",
    "/hub-page/",
    "/client-profile/",
    "/error/",
    "/wp-admin/",
    "/wp-json/",
    "/feed/",
]
